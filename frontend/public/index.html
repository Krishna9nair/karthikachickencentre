        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
          // Register service worker for PWA
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
          }
          // Remove any auto-injected "Made with Emergent" badge (preview env only)
          (function () {
            const kill = () => {
              document.querySelectorAll('#emergent-badge, a[href*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
              document.querySelectorAll('script[src*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
            };
            kill();
            if (document.body) {
              new MutationObserver(kill).observe(document.body, { childList: true, subtree: true });
            }
            let n = 0;
            const t = setInterval(() => { kill(); if (++n > 30) clearInterval(t); }, 1000);
          })();
        </script>
        <style>
          #emergent-badge, a[href*="emergent"] { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
        </style>
    </body>
