<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#B93826" />
        <meta name="description" content="ChickenCrew — Farm-fresh chicken, priced honest. Today's prices and easy UPI ordering." />
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="ChickenCrew" />
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet" />
        <title>ChickenCrew — Today's chicken price & UPI ordering</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
          }
          (function () {
            const kill = () => {
              document.querySelectorAll('#emergent-badge, a[href*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
              document.querySelectorAll('script[src*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
            };
            kill();
            if (document.body) {
              new MutationObserver(kill).observe(document.body, { childList: true, subtree: true });
            }
            let n = 0;
            const t = setInterval(() => { kill(); if (++n > 30) clearInterval(t); }, 1000);
          })();
        </script>
        <style>
          #emergent-badge, a[href*="emergent"] { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
        </style>
    </body>
</html>
