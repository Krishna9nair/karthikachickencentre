        <!--
          Critical above-the-fold CSS — exact pixel-perfect match for the
          first viewport so React's mount produces ZERO visual shift.
          Hero H1 is rendered as static HTML below; this CSS makes it
          look identical to the React-rendered version.
        -->
        <style>
          *,*::before,*::after{box-sizing:border-box}
          /* Initial paint = pure white to match the logo's background. This
             eliminates the jarring "white square around the logo" effect
             when the Capacitor / PWA splash hides. After React mounts we
             flip <html data-ready> and the brand cream background takes
             over with a quick fade. */
          html,body{margin:0;padding:0;background:#FFFFFF;color:#212121;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed;transition:background-color .25s ease-out}
          html[data-ready] body{background:#FFFFFF}
          body{min-height:100vh;line-height:1.5}
          .ssr-shell{max-width:1280px;margin:0 auto;padding:24px 20px 32px;min-height:100vh;background:#FFFFFF}
          .ssr-nav{display:flex;align-items:center;justify-content:space-between;height:56px;margin-bottom:32px}
          .ssr-brand{display:flex;align-items:center;gap:10px}
          .ssr-logo{width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E0E0E0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#D32F2F;font-size:18px;font-family:Georgia,"Fraunces",serif}

          .ssr-brandsub{font-size:9px;letter-spacing:.18em;color:#616161;font-weight:500;margin-top:2px}
          .ssr-cart{background:#D32F2F;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500}
          .ssr-eye{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;background:#FFEBEE;border:1px solid #E0E0E0;border-radius:999px;font-size:11px;font-weight:600;color:#D32F2F;letter-spacing:.2em}
          .ssr-h1{font-family:Georgia,"Fraunces",serif;font-weight:700;color:#212121;font-size:40px;line-height:1.05;margin:16px 0 0;letter-spacing:-0.01em}
          .ssr-h1 em{color:#D32F2F;font-style:italic;font-weight:700}
          .ssr-sub{margin-top:16px;font-size:15px;line-height:1.55;color:#616161;max-width:32rem}
          .ssr-cta{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px}
          .ssr-btn-pri{padding:12px 22px;border-radius:999px;background:#D32F2F;color:#fff;font-weight:500;border:0;font-size:15px}
          .ssr-btn-sec{padding:12px 22px;border-radius:999px;border:1px solid rgba(59,36,22,.2);background:#fff;color:#212121;font-weight:500;font-size:15px}
          @media(min-width:640px){.ssr-h1{font-size:48px}}
          @media(min-width:768px){.ssr-shell{padding:40px 32px 60px}.ssr-h1{font-size:60px}.ssr-sub{font-size:17px}}
          @media(min-width:1024px){.ssr-h1{font-size:72px}}

        <script>
          // Register service worker AFTER first interaction or 3s idle —
          // never compete with LCP / hydration for main thread time.
          //
          // Auto-update strategy: when a new SW is found (new deploy), force
          // it to activate immediately and reload the page so users always
          // see the latest build. This eliminates the "stuck on old build"
          // problem after a Vercel deploy.
          if ('serviceWorker' in navigator) {
            const reg = async () => {
              try {
                const r = await navigator.serviceWorker.register('/service-worker.js');
                // Check for updates every time the tab regains focus
                window.addEventListener('focus', () => r.update().catch(() => {}));
                r.addEventListener('updatefound', () => {
                  const nw = r.installing;
                  if (!nw) return;
                  nw.addEventListener('statechange', () => {
                    if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                      nw.postMessage('SKIP_WAITING');
                    }
                  });
                });
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                  if (refreshing) return;
                  refreshing = true;
                  window.location.reload();
                });
              } catch (e) {}
            };
            if ('requestIdleCallback' in window) {
              requestIdleCallback(reg, { timeout: 3000 });
            } else {
              setTimeout(reg, 2500);
            }
          }
          // Remove any auto-injected "Made with Emergent" badge (preview env only)
          (function () {
            const kill = () => {
              document.querySelectorAll('#emergent-badge, a[href*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
              document.querySelectorAll('script[src*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
            };
            kill();
            if (document.body) {
              new MutationObserver(kill).observe(document.body, { childList: true, subtree: true });
            }
            let n = 0;
            const t = setInterval(() => { kill(); if (++n > 30) clearInterval(t); }, 1000);
          })();
        </script>
        <style>
          #emergent-badge, a[href*="emergent"] { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
        </style>
