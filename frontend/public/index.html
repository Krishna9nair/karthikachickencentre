<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#B93826" />
        <meta name="description" content="Fresh Cluck — Farm-fresh chicken, priced honest. Today's prices and easy UPI ordering." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet" />
        <title>Fresh Cluck — Today's chicken price & UPI ordering</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
          (function() {
            const kill = () => {
              document.querySelectorAll('#emergent-badge, a[href*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
              document.querySelectorAll('script[src*="emergent"]').forEach((el) => {
                try { el.remove(); } catch (e) {}
              });
            };
            kill();
            if (document.body) {
              new MutationObserver(kill).observe(document.body, { childList: true, subtree: true });
            } else {
              document.addEventListener('DOMContentLoaded', () => {
                new MutationObserver(kill).observe(document.body, { childList: true, subtree: true });
              });
            }
            // Fallback: also run every second for 30s in case observer misses
            let n = 0;
            const t = setInterval(() => { kill(); if (++n > 30) clearInterval(t); }, 1000);
          })();
        </script>
        <style>
          #emergent-badge, a[href*="emergent"] { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
        </style>
    </body>
</html>
